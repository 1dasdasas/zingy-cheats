name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build with Flet
      uses: flet-dev/flet-build-action@v1
      with:
        target: apk
        runner-python-version: "3.12"
        bundled-python-version: "3.12"
